name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck -S warning bin/claude-agent bin/agent-handoff install.sh bridge/install.sh
      - run: pip install pytest cryptography && pytest -q tests
